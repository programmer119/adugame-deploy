name: ADUGAME browser QA

on:
  push:
    branches: [qa-v2, qa-v3-parity, benchmark-v5]
  workflow_dispatch:

concurrency:
  group: adugame-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static syntax gate
        run: npm run syntax
      - name: Full-cycle browser gate
        run: npm run test:e2e
      - name: Visual-flow audit collector
        run: npm run test:visual
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adugame-browser-qa-${{ github.ref_name }}
          path: |
            qa/reports/
            test-results/
          if-no-files-found: ignore
