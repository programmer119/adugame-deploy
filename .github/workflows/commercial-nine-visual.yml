name: Commercial nine visual

on:
  push:
    branches: [benchmark-v5]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authored visual syntax gate
        run: node --check remaining-commercial-art-v1.js && node --check g3-commercial-art-v2.js && node --check g3-commercial-art-v2-serve-guard.js && node --check qa/commercial-nine.spec.js && node --check playwright.commercial-nine.config.js
      - name: Capture authored nine-round comparison
        run: npx playwright test --config=playwright.commercial-nine.config.js
      - name: Upload authored comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-nine-visual
          path: qa/reports/commercial-nine/
          if-no-files-found: error
